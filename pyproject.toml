[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
markers = ["integration: 依赖真实权重或端到端的测试"]

[tool.ruff]
line-length = 120
target-version = "py38"
exclude = ["tools", "node_modules", "frontend", "model.py", "model_train.py", "model_test.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
mypy_path = "backend"
files = ["backend", "tests"]
